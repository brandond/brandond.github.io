name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Remove user from docker group
        run: |
          sudo usermod -rG docker $(whoami)

      - name: Show groups
        run: |
          groups

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: type=image,tag=29
          set-host: true
